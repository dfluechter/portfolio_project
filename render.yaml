services:
  - type: web
    name: portfolio-backend
    env: python
    autoDeployTrigger: off
    # Setzt das Arbeitsverzeichnis für Render auf den Backend-Ordner
    rootDir: backend

    # Führt backend/build.sh aus (relativ zu rootDir: backend)
    buildCommand: "./build.sh"

    # Startet den Gunicorn WSGI Server aus dem backend/-Verzeichnis
    startCommand: "uv run gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4"

    # Health-Check Endpunkt für Zero-Downtime Deployments
    # Verifiziert: Das Backend stellt /health_check bereit (siehe core/urls.py & test_views.py)
    healthCheckPath: /health_check

    # Monorepo Build-Filter: Rebuilds bei reinen Dokumentations-Commits ignorieren
    buildFilter:
      paths:
        - backend/**
        - frontend/**
      ignoredPaths:
        - backend/**/*.md
        - docs/**
        - README.md

    # Deklarative Umgebungsvariablen (Sensitive Werte strikt mit sync: false)
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: ALLOWED_HOSTS
        value: "dfluechter.ipv64.de,dfluechter.onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: UV_VERSION
        value: "0.5.29"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "dfluechter.ipv64.de,dfluechter.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://dfluechter.ipv64.de"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dfluechter.ipv64.de"
      # Portfolio-Inhaber & Password-Reset-Konfiguration
      - key: PORTFOLIO_OWNER_NAME
        sync: false
      - key: PORTFOLIO_OWNER_EMAIL
        sync: false
      - key: FRONTEND_DOMAIN
        sync: false
      - key: SITE_NAME
        value: "Dominik Flüchter Portfolio"
      # E-Mail / SMTP Konfiguration
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Supabase S3 Media Storage
      - key: USE_SUPABASE_S3
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: SUPABASE_PUBLIC_MEDIA_URL
        sync: false
      # Google Gemini AI & Zero-Cost Schutz / API-Sicherheit
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_VISION_ENABLED
        value: "true"
      - key: GEMINI_VISION_MAX_FILE_BYTES
        value: "10485760"  # 10 MB Sicherheitsgrenze
      - key: GEMINI_AI_ENABLED
        value: "True"
      - key: DAILY_TOKEN_LIMIT
        value: "50000"
      - key: GEMINI_DAILY_TOKEN_LIMIT
        value: "50000"
      - key: MAX_DAILY_AI_REQUESTS
        value: "100"
      - key: GEMINI_DAILY_REQUEST_LIMIT
        value: "100"
      - key: GEMINI_MAX_INPUT_TOKENS
        value: "4000"

  - type: web
    name: portfolio-frontend
    runtime: static
    autoDeployTrigger: off
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
      ignoredPaths:
        - frontend/**/*.md
        - docs/**
        - README.md
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-backend.onrender.com
