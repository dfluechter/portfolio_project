# Exported from Render on 2026-08-20T18:10:08Z
version: "1"
projects:
- name: MyPortfolio
  environments:
  - name: prod
    services:
    - type: web
      name: portfolio-project
      runtime: python
      repo: https://github.com/dfluechter/portfolio_project
      plan: free
      envVars:
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        sync: false
      - key: PYTHON_VERSION
        sync: false
      - key: USE_SUPABASE_S3
        value: "True"
      - key: SUPABASE_PUBLIC_MEDIA_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: AWS_S3_REGION_NAME
        value: "eu-central-1"
      region: frankfurt
      buildCommand: bash build.sh
      startCommand: gunicorn core.wsgi:application
      healthCheckPath: /health_check
      domains:
      - dfluechter.ipv64.de
      autoDeployTrigger: off
      renderSubdomainPolicy: disabled
