services:
  - type: web
    name: portfolio-backend 
    env: python 
    # Setzt das Arbeitsverzeichnis für Render auf den neuen Backend-Ordner
    rootDir: backend 
   
    # Python-Version und Build-Befehle9
    envVars: 
      - key: PYTHON\_VERSION 
        value: 3.13.0 
      # Weitere Umgebungsvariablen wie DATABASE\_URL, SECRET\_KEY usw.
     
    # Führt das überarbeitete build.sh-Skript aus 
    buildCommand: ./build.sh 
    
    # Startet den Gunicorn WSGI Server aus dem backend/-Verzeichnis 
    startCommand: uv run gunicorn core.wsgi:application 
    
    # Optional: Health-Check Endpunkt konfigurieren
    healthCheckPath: /health\_check