services:
  - type: web
    name: portfolio-backend
    env: python
    autoDeployTrigger: off
    # Setzt das Arbeitsverzeichnis für Render auf den Backend-Ordner
    rootDir: backend

    # Führt backend/build.sh aus (relativ zu rootDir: backend).
    # Aufruf via bash, damit kein Executable-Bit benötigt wird.
    buildCommand: bash build.sh

    # Startet den Gunicorn WSGI Server aus dem backend/-Verzeichnis
    startCommand: uv run gunicorn core.wsgi:application

    # Health-Check Endpunkt für Zero-Downtime Deployments
    healthCheckPath: /health_check

    # Monorepo Build-Filter: Rebuilds bei reinen Dokumentations-Commits ignorieren
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/**/*.md
        - docs/**
        - README.md

    # Deklarative Umgebungsvariablen (Sensitive Werte strikt mit sync: false)
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: UV_VERSION
        value: "0.5.29"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PORTFOLIO_OWNER_NAME
        sync: false
      - key: PORTFOLIO_OWNER_EMAIL
        sync: false
      - key: FRONTEND_DOMAIN
        sync: false
      - key: SITE_NAME
        value: "Dominik Flüchter Portfolio"
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: USE_SUPABASE_S3
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: SUPABASE_PUBLIC_MEDIA_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: portfolio-frontend
    runtime: static
    autoDeployTrigger: off
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
      ignoredPaths:
        - frontend/**/*.md
        - docs/**
        - README.md
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-backend.onrender.com
