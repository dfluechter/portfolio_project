[project]
name = "portfolio_project"
version = "0.1.0"
description = "Mein Portfolio Backend"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2",
    "gunicorn>=22.0",
    "dj-database-url>=2.2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "whitenoise[brotli]>=6.7",
    "django-storages[boto3]>=1.14",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-django>=4.8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]