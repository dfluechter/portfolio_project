# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # ============================================================================
  # 1. Standard-Sicherheits- und Format-Checks
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-toml
      - id: check-merge-conflict

  # ============================================================================
  # 2. Python Qualitätssicherung (Ruff Linter & Formatter für backend/)
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ============================================================================
  # 3. Python Statische Typprüfung (MyPy im backend/-Kontext via uv)
  # ============================================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy (lokal via uv)
        entry: uv run --directory backend mypy .
        language: system
        types: [python]
        pass_filenames: false

  # ============================================================================
  # 4. Git-Commit-Meldungen validieren (Commitlint)
  # ============================================================================
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
