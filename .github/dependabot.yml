version: 2
updates:
  # Maintain Python dependencies via uv in /backend
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-backend)"
      include: "scope"
    open-pull-requests-limit: 5

  # Maintain Node.js dependencies via npm in /frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-frontend)"
      include: "scope"
    open-pull-requests-limit: 5

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps-ci)"
    open-pull-requests-limit: 3
