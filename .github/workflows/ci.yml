name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Verhindert redundante parallele CI-Läufe bei schnellen Folge-Pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of Least Privilege: Standardmäßig nur lesender Zugriff
permissions:
  contents: read

jobs:
  # --- JOB 1: Commitlint (Conventional Commits Prüfung) ---
  commitlint:
    name: Conventional Commits Linter
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken (mit vollständiger Git-Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commitlint ausführen
        uses: wagoid/commitlint-github-action@v6

  # --- JOB 2: Backend-CI (Python 3.13 + uv + Pytest + Ruff + MyPy) ---
  backend-ci:
    name: Backend CI (Python & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: uv installieren und konfigurieren
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Python-Abhängigkeiten synchronisieren
        run: uv sync --frozen

      - name: Code-Style prüfen (Ruff Linter)
        run: uv run ruff check .

      - name: Code-Formatierung prüfen (Ruff Formatter)
        run: uv run ruff format --check .

      - name: Statische Typprüfung (MyPy)
        run: uv run mypy .

      - name: Backend-Tests mit Coverage-Gate ausführen (Pytest >= 95%)
        run: uv run pytest --cov=portfolio --cov-report=xml --cov-fail-under=95
        env:
          SECRET_KEY: "django-insecure-ci-test-key-for-jwt-signing-github-actions"
          USE_SUPABASE_S3: "False"
          GEMINI_API_KEY: "mock-gemini-key-for-ci-runs"

  # --- JOB 3: Frontend-CI (Node.js 20 + Oxlint + Vitest + Vite Build) ---
  frontend-ci:
    name: Frontend CI (TypeScript, Lint, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      - name: Frontend-Linter ausführen (Oxlint)
        run: npm run lint

      - name: Vitest Komponententests ausführen
        run: npm run test

      - name: TypeScript-Typen & Vite-Produktions-Build prüfen
        run: npm run build

  # --- JOB 4: Backend-Build (Produktions-Artefakt-Verifikation) ---
  backend-build:
    name: Backend Build & Migration Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: uv einrichten
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Produktions-Abhängigkeiten installieren
        run: uv sync --frozen --no-dev

      - name: Django System-Checks durchführen
        run: uv run python manage.py check --deploy
        env:
          SECRET_KEY: "django-insecure-ci-production-check-secret-key"
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"

      - name: Ausstehende Schema-Migrationen prüfen (makemigrations check)
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: "django-insecure-ci-production-check-secret-key"

      - name: Statische Dateien kompilieren (collectstatic)
        run: uv run python manage.py collectstatic --noinput
        env:
          SECRET_KEY: "django-insecure-ci-production-check-secret-key"

  # --- JOB 5: Deploy (Zero-Downtime Server Deployment auf Render) ---
  deploy:
    name: Render Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Render Deploy Hook triggern
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL" || {
              echo "Deploy-Hook fehlgeschlagen. Starte Retry in 10 Sekunden..."
              sleep 10
              curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            }
            echo "Deploy-Signal erfolgreich an Render übermittelt."
          else
            echo "RENDER_DEPLOY_HOOK_URL Secret ist nicht hinterlegt. Überspringe automatischen Hook."
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
