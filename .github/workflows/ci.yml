name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --- JOB 1: Commitlint (Conventional Commits Prüfung) ---
  commitlint:
    name: Conventional Commits Linter
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken (mit vollständiger Git-Historie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Benötigt die Historie, um Commits in PRs korrekt zu prüfen

      - name: Commitlint ausführen
        uses: wagoid/commitlint-github-action@v6

  # --- JOB 2: Stateless Backend-CI (Python 3.13 + uv + Pytest + Ruff + MyPy) ---
  backend-ci:
    name: Backend CI (Python & Pytest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.13 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: uv installieren und konfigurieren
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # Aktiviert automatisches Caching für unschlagbare Build-Zeiten

      - name: Python-Abhängigkeiten installieren
        run: uv sync --frozen

      - name: Code-Style prüfen (Ruff Linter)
        run: uv run ruff check .

      - name: Code-Formatierung prüfen (Ruff Formatter)
        run: uv run ruff format --check .

      - name: Statische Typprüfung (MyPy)
        run: uv run mypy .

      - name: JWT-basierte Backend-Tests ausführen (Pytest)
        run: uv run pytest --cov=portfolio --cov-report=xml
        env:
          SECRET_KEY: "django-insecure-ci-test-key-for-jwt-signing-github-actions"
          USE_S3: "False" # Verwendet die Mock-S3-Infrastruktur im Testlauf

  # --- JOB 3: Frontend-CI (Node.js 20 + TypeScript + Vite Build) ---
  frontend-ci:
    name: Frontend CI (TypeScript & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend-Abhängigkeiten installieren
        run: |
          cd frontend
          npm ci

      - name: TypeScript-Typen & Vite-Produktions-Build prüfen
        run: |
          cd frontend
          npm run build
