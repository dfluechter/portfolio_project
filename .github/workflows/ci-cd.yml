name: Django CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        # Nutzt uv für eine extrem schnelle Installation aus der pyproject.toml
        uv pip install --system -e .

    - name: System Checks & Tests
      env:
        # Dummy-Variablen für den CI-Lauf, falls Django diese beim Start benötigt
        SECRET_KEY: "django-insecure-ci-dummy-key"
        DEBUG: "True"
      run: |
        # Prüft, ob Syntax oder Models fehlerhaft sind
        python manage.py check
        
        # Falls du Pytest nutzt, wird es hier ausgeführt
        uv run pytest