name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python 3.14 aufsetzen
      uses: actions/setup-python@v5
      with:
        python-version: "3.14.3"
        cache: "pip"

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Installiert flake8 für das Linting
        pip install flake8

    - name: Linting mit Flake8
      run: |
        # Stoppt den Build bei Syntaxfehlern oder undefinierten Namen
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warnungen ausgeben (bricht den Build nicht ab)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Pytest ausführen
      env:
        # Dummy-Key für die CI-Umgebung, damit Django startet
        SECRET_KEY: "ci-dummy-key-for-testing-only"
        DEBUG: "True"
        # Keine DATABASE_URL definiert = Nutzt automatisch SQLite für schnelle Tests
      run: |
        pytest

    - name: Render Deployment auslösen
      # Dieser Schritt wird NUR ausgeführt, wenn pytest und flake8 erfolgreich waren
      if: success() && github.ref == 'refs/heads/main'
      env:
        deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        echo "Tests erfolgreich! Starte Deployment auf Render..."
        curl "$deploy_url"