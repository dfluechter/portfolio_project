name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. QUALITY & LINTING ──
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff Linter
        run: uv run ruff check .

      - name: Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Mypy Type Check
        run: uv run mypy .

  # ── 2. TESTS & COVERAGE ──
  test:
    name: 🧪 Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Tests with Coverage
        run: uv run pytest --cov=core --cov=portfolio --cov-report=term-missing

  # ── 3. BUILD VERIFICATION ──
  build:
    name: 📦 Verify Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install production dependencies
        run: uv sync --frozen --no-dev

      - name: Django System Check
        env:
          SECRET_KEY: "ci-build-test-secret-key"
          DEBUG: "False"
        run: uv run python manage.py check

      - name: Test Collectstatic
        env:
          SECRET_KEY: "ci-build-test-secret-key"
          DEBUG: "False"
        run: uv run python manage.py collectstatic --noinput

  # ── 4. DEPLOY TO RENDER ──
  deploy:
    name: 🚀 Deploy to Render
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set!"
            exit 1
          fi
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
