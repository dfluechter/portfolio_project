name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. QUALITY & LINTING ──
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff Linter
        run: uv run ruff check .

      - name: Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Mypy Type Check
        run: uv run mypy .

  # ── 2. TESTS & COVERAGE ──
  test:
    name: 🧪 Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Neon configuration
        env:
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          test -n "$NEON_PROJECT_ID" || { echo "::error::NEON_PROJECT_ID is not configured"; exit 1; }
          test -n "$NEON_API_KEY" || { echo "::error::NEON_API_KEY is not configured"; exit 1; }

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ github.head_ref || format('ci-{0}', github.sha) }}
          username: neondb_owner
          database: neondb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
        run: uv run pytest --cov=core --cov=portfolio --cov-report=term-missing --cov-fail-under=95

      - name: Clean up Neon Branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: npx neonctl branches delete ${{ steps.create-branch.outputs.branch_id }} --project-id ${{ secrets.NEON_PROJECT_ID }}

  # ── 3. BUILD VERIFICATION ──
  build:
    name: 📦 Verify Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13.14

      - name: Install production dependencies
        run: uv sync --frozen --no-dev

      - name: Django System Check
        env:
          SECRET_KEY: "ci-build-test-secret-key"
          DEBUG: "False"
        run: uv run python manage.py check

      - name: Test Collectstatic
        env:
          SECRET_KEY: "ci-build-test-secret-key"
          DEBUG: "False"
        run: uv run python manage.py collectstatic --noinput

  # ── 4. DEPLOY TO RENDER ──
  deploy:
    name: 🚀 Deploy to Render
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set!"
            exit 1
          fi
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
