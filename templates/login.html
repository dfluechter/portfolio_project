<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Portfolio – Login</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bs-body-bg);
      transition: background-color .25s;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      border: 1px solid var(--bs-border-color);
      box-shadow: 0 12px 48px rgba(0, 0, 0, .35);
    }

    [data-bs-theme="light"] .login-card {
      box-shadow: 0 8px 32px rgba(0, 0, 0, .10);
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #4f6ef7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      flex-shrink: 0;
    }

    .form-control:focus {
      box-shadow: 0 0 0 3px rgba(79, 110, 247, .25);
      border-color: #4f6ef7;
    }

    .btn-login {
      background: #4f6ef7;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: .02em;
      transition: background .2s, transform .1s;
    }
    .btn-login:hover   { background: #3b5bdb; }
    .btn-login:active  { transform: scale(.98); }
    .btn-login:disabled { opacity: .65; }

    .lang-btn.active {
      background: rgba(79, 110, 247, .15);
      border-color: #4f6ef7 !important;
      color: #4f6ef7 !important;
    }

    .divider-text {
      font-size: .78rem;
      color: var(--bs-secondary-color);
    }

    .spinner-border-sm { width: 1rem; height: 1rem; }
  </style>
</head>

<body>
<div class="container px-3">
  <div class="login-card card mx-auto p-4 p-sm-5">

    <!-- Top bar: theme + language -->
    <div class="d-flex justify-content-end gap-2 mb-4">
      <button class="btn btn-sm btn-outline-secondary lang-btn active" id="lang-de" onclick="setLang('de')">DE</button>
      <button class="btn btn-sm btn-outline-secondary lang-btn"        id="lang-en" onclick="setLang('en')">EN</button>
      <button class="btn btn-sm btn-outline-secondary" id="theme-btn"  onclick="toggleTheme()" title="Theme wechseln">
        <i class="fa-solid fa-sun" id="theme-icon"></i>
      </button>
    </div>

    <!-- Logo + headline -->
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="logo-icon">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <div>
        <h1 class="fs-5 fw-bold mb-0" id="t-headline">Portfolio</h1>
        <p class="text-secondary mb-0 small" id="t-subline">Backend Dashboard</p>
      </div>
    </div>

    <!-- Alerts -->
    <div id="error-banner"   class="alert alert-danger   d-none py-2 small" role="alert"></div>
    <div id="success-banner" class="alert alert-success  d-none py-2 small" role="alert"></div>

    <!-- Form -->
    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-uppercase text-secondary ls-wide" id="t-email-label">E-Mail</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
          <input type="email" class="form-control" id="email" autocomplete="email" required />
        </div>
      </div>

      <!-- Password Group -->
      <div class="mb-4" id="pw-group">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label for="password" class="form-label mb-0 small fw-semibold text-uppercase text-secondary" id="t-pw-label">Passwort</label>
          <a href="#" onclick="toggleMode('reset', event)" class="small text-decoration-none" id="t-forgot-pw">Passwort vergessen?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="password" autocomplete="current-password" required />
          <button type="button" class="btn btn-outline-secondary" onclick="togglePw()" tabindex="-1">
            <i class="fa-regular fa-eye" id="pw-eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-login btn-primary w-100 py-2" id="submit-btn">
        <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner" role="status"></span>
        <i class="fa-solid fa-right-to-bracket me-1"></i>
        <span id="t-submit">Anmelden</span>
      </button>
    </form>

    <!-- Additional Options Group -->
    <div id="admin-group">
      <!-- Divider -->
      <div class="d-flex align-items-center gap-2 my-4">
        <hr class="flex-grow-1 m-0" />
        <span class="divider-text" id="t-divider">oder</span>
        <hr class="flex-grow-1 m-0" />
      </div>

      <!-- Admin link -->
      <a href="/dashboard/" class="btn btn-outline-secondary w-100">
        <i class="fa-solid fa-shield-halved me-1"></i>
        <span id="t-admin-link">Dashboard</span>
      </a>
    </div>

    <!-- Back to Login option (hidden by default) -->
    <div id="back-to-login-container" class="text-center d-none mt-3">
      <a href="#" onclick="toggleMode('login', event)" class="small text-decoration-none" id="t-back-to-login">Zurück zum Login</a>
    </div>

    <!-- Footer -->
    <p class="text-center text-secondary mt-4 mb-0" style="font-size:.75rem;">
      <i class="fa-regular fa-copyright me-1"></i>
      <span id="t-footer">Dominik Fluechter · Portfolio Backend</span>
    </p>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  /* ── i18n ── */
  const i18n = {
    de: {
      title:          "Portfolio – Login",
      headline:       "Portfolio",
      subline:        "Backend Dashboard",
      emailLabel:     "E-Mail",
      pwLabel:        "Passwort",
      forgotPw:       "Passwort vergessen?",
      backToLogin:    "Zurück zum Login",
      resetHeadline:  "Passwort zurücksetzen",
      resetSubline:   "Geben Sie Ihre E-Mail-Adresse ein.",
      resetSubmit:    "Reset-Link senden",
      resetSuccess:   "Ein Link zum Zurücksetzen des Passworts wurde gesendet!",
      submit:         "Anmelden",
      divider:        "oder",
      adminLink:      "Dashboard",
      footer:         "Dominik Fluechter · Portfolio Backend",
      errInvalid:     "E-Mail oder Passwort ungültig.",
      errNetwork:     "Verbindungsfehler. Bitte erneut versuchen.",
      success:        "Login erfolgreich! Weiterleitung …",
    },
    en: {
      title:          "Portfolio – Login",
      headline:       "Portfolio",
      subline:        "Backend Dashboard",
      emailLabel:     "E-Mail",
      pwLabel:        "Password",
      forgotPw:       "Forgot password?",
      backToLogin:    "Back to login",
      resetHeadline:  "Reset Password",
      resetSubline:   "Enter your email address.",
      resetSubmit:    "Send reset link",
      resetSuccess:   "A password reset link has been sent!",
      submit:         "Sign in",
      divider:        "or",
      adminLink:      "Dashboard",
      footer:         "Dominik Fluechter · Portfolio Backend",
      errInvalid:     "Invalid email or password.",
      errNetwork:     "Connection error. Please try again.",
      success:        "Login successful! Redirecting …",
    }
  };

  let lang  = localStorage.getItem("lang")  || "de";
  let theme = localStorage.getItem("theme") || "dark";
  let mode  = "login";

  function setLang(l) {
    lang = l;
    localStorage.setItem("lang", l);
    
    // Set static UI indicators
    document.getElementById("lang-de").classList.toggle("active", l === "de");
    document.getElementById("lang-en").classList.toggle("active", l === "en");
    
    // Update translations according to active mode
    toggleMode(mode);
  }

  function applyTheme(t) {
    document.documentElement.setAttribute("data-bs-theme", t);
    const icon = document.getElementById("theme-icon");
    icon.className = t === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
  }

  function toggleTheme() {
    theme = theme === "dark" ? "light" : "dark";
    localStorage.setItem("theme", theme);
    applyTheme(theme);
  }

  function togglePw() {
    const inp  = document.getElementById("password");
    const icon = document.getElementById("pw-eye-icon");
    if (inp.type === "password") {
      inp.type = "text";
      icon.className = "fa-regular fa-eye-slash";
    } else {
      inp.type = "password";
      icon.className = "fa-regular fa-eye";
    }
  }

  function toggleMode(m, e) {
    if (e) e.preventDefault();
    mode = m;
    const t = i18n[lang];
    
    const pwGroup = document.getElementById("pw-group");
    const adminGroup = document.getElementById("admin-group");
    const backToLoginContainer = document.getElementById("back-to-login-container");
    const submitBtnSpan = document.getElementById("t-submit");
    const submitBtnIcon = document.querySelector("#submit-btn i");
    const headline = document.getElementById("t-headline");
    const subline = document.getElementById("t-subline");
    
    // Clean alert visibility
    document.getElementById("error-banner").classList.add("d-none");
    document.getElementById("success-banner").classList.add("d-none");

    if (m === "reset") {
      pwGroup.classList.add("d-none");
      adminGroup.classList.add("d-none");
      backToLoginContainer.classList.remove("d-none");
      
      headline.textContent = t.resetHeadline;
      subline.textContent = t.resetSubline;
      submitBtnSpan.textContent = t.resetSubmit;
      submitBtnIcon.className = "fa-solid fa-paper-plane me-1";
    } else {
      pwGroup.classList.remove("d-none");
      adminGroup.classList.remove("d-none");
      backToLoginContainer.classList.add("d-none");
      
      headline.textContent = t.headline;
      subline.textContent = t.subline;
      submitBtnSpan.textContent = t.submit;
      submitBtnIcon.className = "fa-solid fa-right-to-bracket me-1";
    }
    
    // Always translate labels
    document.title = t.title;
    document.getElementById("t-email-label").textContent = t.emailLabel;
    document.getElementById("t-pw-label").textContent = t.pwLabel;
    document.getElementById("t-forgot-pw").textContent = t.forgotPw;
    document.getElementById("t-back-to-login").textContent = t.backToLogin;
    document.getElementById("t-divider").textContent = t.divider;
    document.getElementById("t-admin-link").textContent = t.adminLink;
    document.getElementById("t-footer").textContent = t.footer;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const t       = i18n[lang];
    const btn     = document.getElementById("submit-btn");
    const spinner = document.getElementById("spinner");
    const errEl   = document.getElementById("error-banner");
    const okEl    = document.getElementById("success-banner");

    errEl.classList.add("d-none");
    okEl.classList.add("d-none");
    btn.disabled = true;
    spinner.classList.remove("d-none");

    const email = document.getElementById("email").value;

    if (mode === "login") {
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email, password }),
      });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem("access_token",  data.access);
          localStorage.setItem("refresh_token", data.refresh);
          okEl.textContent = t.success;
          okEl.classList.remove("d-none");
          setTimeout(() => { window.location.href = "/dashboard/"; }, 1000);
        } else {
          let errMsg = t.errInvalid;
          try {
            const errData = await res.json();
            if (errData.detail) {
              errMsg = errData.detail;
            } else if (typeof errData === 'object') {
              errMsg = Object.entries(errData)
                .map(([key, val]) => `${key}: ${Array.isArray(val) ? val.join(" ") : val}`)
                .join(" | ");
            }
          } catch (_) {}
          errEl.textContent = errMsg;
          errEl.classList.remove("d-none");
          btn.disabled = false;
          spinner.classList.add("d-none");
        }
      } catch {
        errEl.textContent = t.errNetwork;
        errEl.classList.remove("d-none");
        btn.disabled = false;
        spinner.classList.add("d-none");
      }
    } else {
      // mode === "reset"
      try {
        const res = await fetch("/api/auth/users/reset_password/", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email }),
        });

        if (res.ok) {
          okEl.textContent = t.resetSuccess;
          okEl.classList.remove("d-none");
          document.getElementById("email").value = "";
          btn.disabled = false;
          spinner.classList.add("d-none");
          setTimeout(() => { toggleMode("login"); }, 4000);
        } else {
          let errMsg = t.errNetwork;
          try {
            const errData = await res.json();
            if (errData.detail) {
              errMsg = errData.detail;
            } else if (typeof errData === 'object') {
              errMsg = Object.entries(errData)
                .map(([key, val]) => `${key}: ${Array.isArray(val) ? val.join(" ") : val}`)
                .join(" | ");
            }
          } catch (_) {}
          errEl.textContent = errMsg;
          errEl.classList.remove("d-none");
          btn.disabled = false;
          spinner.classList.add("d-none");
        }
      } catch {
        errEl.textContent = t.errNetwork;
        errEl.classList.remove("d-none");
        btn.disabled = false;
        spinner.classList.add("d-none");
      }
    }
  }

  /* Init */
  applyTheme(theme);
  setLang(lang);
</script>
</body>
</html>
