<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Portfolio • Admin Login</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Font Awesome 6 Pro/Free CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --color-primary: #6366f1;
      --color-primary-dark: #4f46e5;
      --color-cyan: #06b6d4;
      --color-violet: #8b5cf6;
      --color-fuchsia: #d946ef;
      
      --gradient-accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
      --gradient-button: linear-gradient(135deg, #4f46e5 0%, #7c3aed 60%, #0891b2 100%);
      --gradient-button-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 60%, #0e7490 100%);
      --gradient-border: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(139, 92, 246, 0.1), rgba(6, 182, 212, 0.35));
    }

    [data-bs-theme="dark"] {
      --bg-body: #060913;
      --bg-grid: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 1px, transparent 1px);
      --card-bg: rgba(13, 18, 32, 0.72);
      --card-inner: rgba(17, 24, 39, 0.6);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 25px 65px -12px rgba(0, 0, 0, 0.75), 0 0 45px rgba(99, 102, 241, 0.15);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      
      --input-bg: rgba(15, 23, 42, 0.75);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus-border: #6366f1;
      --input-focus-glow: rgba(99, 102, 241, 0.35);
      
      --orb-color-1: rgba(99, 102, 241, 0.28);
      --orb-color-2: rgba(217, 70, 239, 0.22);
      --orb-color-3: rgba(6, 182, 212, 0.18);
      
      --badge-bg: rgba(99, 102, 241, 0.12);
      --badge-border: rgba(99, 102, 241, 0.28);
      --badge-text: #a5b4fc;
    }

    [data-bs-theme="light"] {
      --bg-body: #f8fafc;
      --bg-grid: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.06) 1px, transparent 1px);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-inner: rgba(248, 250, 252, 0.75);
      --card-border: rgba(226, 232, 240, 0.9);
      --card-shadow: 0 20px 50px -10px rgba(99, 102, 241, 0.12), 0 4px 20px rgba(0, 0, 0, 0.04);
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      
      --input-bg: rgba(255, 255, 255, 0.95);
      --input-border: #cbd5e1;
      --input-focus-border: #6366f1;
      --input-focus-glow: rgba(99, 102, 241, 0.2);
      
      --orb-color-1: rgba(99, 102, 241, 0.14);
      --orb-color-2: rgba(217, 70, 239, 0.1);
      --orb-color-3: rgba(6, 182, 212, 0.12);
      
      --badge-bg: rgba(99, 102, 241, 0.08);
      --badge-border: rgba(99, 102, 241, 0.2);
      --badge-text: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Ambient Dot Matrix Grid */
    .bg-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: var(--bg-grid);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    /* Ambient Bioluminescent Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      transition: all 0.5s ease;
      animation: floatOrb 16s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      top: -120px;
      left: -120px;
      background: var(--orb-color-1);
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      bottom: -100px;
      right: -100px;
      background: var(--orb-color-2);
      animation-delay: -5s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      top: 40%;
      left: 60%;
      background: var(--orb-color-3);
      animation-delay: -10s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(25px, -30px) scale(1.08); }
      100% { transform: translate(-20px, 25px) scale(0.95); }
    }

    /* Main Container & Glass Card */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--card-shadow);
      padding: 2.25rem 2rem 2rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 1px;
      background: var(--gradient-border);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @media (min-width: 576px) {
      .glass-card {
        padding: 2.75rem 2.5rem 2.25rem;
      }
    }

    /* Top Control Bar */
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--badge-text);
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .controls-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-inner);
      padding: 3px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pill-btn:hover {
      color: var(--text-main);
      background: rgba(99, 102, 241, 0.15);
    }

    .pill-btn.active {
      background: var(--gradient-accent);
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }

    /* Visual Graphic Hero Icon */
    .hero-graphic-box {
      text-align: center;
      margin-bottom: 1.75rem;
      position: relative;
    }

    .shield-svg-wrapper {
      width: 84px;
      height: 84px;
      margin: 0 auto 1.25rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shield-svg-wrapper::after {
      content: '';
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, transparent 70%);
      filter: blur(14px);
      z-index: 0;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .shield-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 8px 16px rgba(99, 102, 241, 0.35));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .glass-card:hover .shield-svg {
      transform: scale(1.06) rotate(-2deg);
    }

    .brand-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, var(--text-main) 30%, var(--color-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtext {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Form Fields & Micro-Interactions */
    .form-group-custom {
      margin-bottom: 1.25rem;
    }

    .form-label-custom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-input-container {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .form-input-container:focus-within {
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 4px var(--input-focus-glow);
      background: var(--card-bg);
    }

    .input-icon-left {
      position: absolute;
      left: 1.1rem;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-input-container:focus-within .input-icon-left {
      color: var(--color-primary);
    }

    .form-control-custom {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.85rem 1rem 0.85rem 3rem;
      outline: none;
      font-family: inherit;
    }

    .form-control-custom::placeholder {
      color: var(--text-faint);
    }

    .pw-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0 1.1rem;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pw-action-btn:hover {
      color: var(--color-primary);
      transform: scale(1.1);
    }

    /* Links & Secondary Actions */
    .link-action {
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .link-action:hover {
      color: var(--color-cyan);
      text-decoration: underline;
    }

    /* Submit Button with Gradient & Ripple Effect */
    .btn-submit-main {
      width: 100%;
      background: var(--gradient-button);
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.975rem;
      padding: 0.9rem 1.5rem;
      border-radius: 16px;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .btn-submit-main:hover {
      background: var(--gradient-button-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.55);
      color: #ffffff;
    }

    .btn-submit-main:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.35);
    }

    .btn-submit-main:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Notifications & Alert Banners */
    .alert-banner {
      border-radius: 14px;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 1.25rem;
      animation: slideInDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-banner-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .alert-banner-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    /* Footer Security Meta */
    .login-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .footer-security-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .d-none {
      display: none !important;
    }

    .spin-icon {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Ambient Dot Matrix Grid -->
  <div class="bg-grid-pattern"></div>

  <!-- Ambient Light Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <div class="login-wrapper">
    <div class="glass-card">
      
      <!-- Top Control Bar -->
      <div class="top-controls">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="t-system-status">SYS • ONLINE</span>
        </div>

        <div class="controls-group">
          <button class="pill-btn lang-btn active" id="lang-de" onclick="setLanguage('de')" title="Deutsch">DE</button>
          <button class="pill-btn lang-btn" id="lang-en" onclick="setLanguage('en')" title="English">EN</button>
          <button class="pill-btn" id="theme-btn" onclick="toggleTheme()" title="Design wechseln">
            <i class="fa-solid fa-sun" id="theme-icon"></i>
          </button>
        </div>
      </div>

      <!-- Hero Emblem Graphic & Title -->
      <div class="hero-graphic-box">
        <div class="shield-svg-wrapper">
          <svg class="shield-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="50%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#06b6d4" />
              </linearGradient>
              <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.3" />
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>
            <!-- Outer Geometric Cyber-Shield -->
            <path d="M50 8L86 24V48C86 69.5 70.5 87.8 50 94C29.5 87.8 14 69.5 14 48V24L50 8Z" 
                  fill="url(#shieldGrad)" fill-opacity="0.22" stroke="url(#shieldGrad)" stroke-width="2.5" />
            
            <!-- Inner Hex Nodes & Grid Lines -->
            <path d="M50 18L76 30V48C76 64 64.5 78 50 83C35.5 78 24 64 24 48V30L50 18Z" 
                  stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="3 3" />
            
            <!-- Center Glowing Keyhole / Secure Node -->
            <circle cx="50" cy="46" r="9" fill="url(#shieldGrad)" filter="url(#glow)" />
            <path d="M46 51L44 65H56L54 51C56.2 49.5 57.5 47 57.5 44C57.5 39.9 54.1 36.5 50 36.5C45.9 36.5 42.5 39.9 42.5 44C42.5 47 43.8 49.5 46 51Z" 
                  fill="#ffffff" />
            
            <!-- Orbit Particles -->
            <circle cx="28" cy="38" r="2" fill="#06b6d4" />
            <circle cx="72" cy="38" r="2" fill="#a855f7" />
            <circle cx="50" cy="74" r="2.5" fill="#6366f1" />
          </svg>
        </div>

        <h1 class="brand-title" id="t-headline">Portfolio Admin</h1>
        <p class="brand-subtext" id="t-subline">Melden Sie sich an, um das Dashboard zu verwalten.</p>
      </div>

      <!-- Dynamic Alert Containers -->
      <div id="error-banner" class="alert-banner alert-banner-error d-none" role="alert">
        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
        <span id="error-banner-text">E-Mail oder Passwort ungültig.</span>
      </div>

      <div id="success-banner" class="alert-banner alert-banner-success d-none" role="alert">
        <i class="fa-solid fa-circle-check mt-0.5"></i>
        <span id="success-banner-text">Login erfolgreich! Weiterleitung …</span>
      </div>

      <!-- Authentication Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" novalidate>
        
        <!-- Email Input -->
        <div class="form-group-custom">
          <label for="email" class="form-label-custom">
            <span id="t-email-label">E-Mail-Adresse</span>
            <i class="fa-solid fa-fingerprint text-muted opacity-75"></i>
          </label>
          <div class="form-input-container">
            <i class="fa-regular fa-envelope input-icon-left"></i>
            <input type="email" 
                   id="email" 
                   class="form-control-custom" 
                   autocomplete="email" 
                   placeholder="admin@example.com" 
                   required />
          </div>
        </div>

        <!-- Password Input Group (Hidden in Reset Mode) -->
        <div class="form-group-custom" id="password-group">
          <div class="form-label-custom">
            <span id="t-pw-label">Passwort</span>
            <a href="#" onclick="switchMode('reset', event)" class="link-action" id="t-forgot-link">
              <i class="fa-solid fa-key me-1"></i>Passwort vergessen?
            </a>
          </div>
          <div class="form-input-container">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input type="password" 
                   id="password" 
                   class="form-control-custom" 
                   autocomplete="current-password" 
                   placeholder="••••••••••••" 
                   required />
            <button type="button" 
                    class="pw-action-btn" 
                    onclick="togglePasswordVisibility()" 
                    tabindex="-1" 
                    title="Passwort ein-/ausblenden"
                    aria-label="Passwort ein-/ausblenden">
              <i class="fa-regular fa-eye" id="pw-eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-main" id="submit-btn">
          <i class="fa-solid fa-arrow-right-to-bracket" id="submit-btn-icon"></i>
          <i class="fa-solid fa-circle-notch spin-icon d-none" id="submit-spinner"></i>
          <span id="t-submit-text">Anmelden</span>
        </button>

      </form>

      <!-- Back to Login Navigation (Visible only in Reset Mode) -->
      <div id="back-to-login-row" class="text-center mt-3 d-none">
        <a href="#" onclick="switchMode('login', event)" class="link-action" id="t-back-to-login">
          <i class="fa-solid fa-arrow-left me-1"></i> Zurück zum Login
        </a>
      </div>

      <!-- Footer Info -->
      <footer class="login-footer">
        <span class="footer-security-tag">
          <i class="fa-solid fa-shield-halved text-success"></i>
          <span>TLS • 256-BIT</span>
        </span>
        <span id="t-footer-copy">© 2026 Dominik Flüchter</span>
      </footer>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ── Multi-Language Dictionary ── */
    const i18n = {
      de: {
        pageTitle:     "Portfolio • Admin Login",
        systemStatus:  "SYS • ONLINE",
        headline:      "Portfolio Admin",
        subline:       "Melden Sie sich an, um das Dashboard zu verwalten.",
        emailLabel:    "E-Mail-Adresse",
        pwLabel:       "Passwort",
        forgotPw:      "Passwort vergessen?",
        submitLogin:   "Anmelden",
        backToLogin:   "Zurück zum Login",
        resetHeadline: "Passwort zurücksetzen",
        resetSubline:  "Geben Sie Ihre E-Mail ein, um einen Reset-Link zu erhalten.",
        resetSubmit:   "Reset-Link anfordern",
        resetSuccess:  "Ein Reset-Link wurde an Ihre E-Mail gesendet!",
        loginSuccess:  "Login erfolgreich! Weiterleitung …",
        errInvalid:    "E-Mail-Adresse oder Passwort ungültig.",
        errNetwork:    "Verbindungsfehler. Bitte Server prüfen.",
        footerCopy:    "© 2026 Dominik Flüchter"
      },
      en: {
        pageTitle:     "Portfolio • Admin Login",
        systemStatus:  "SYS • ONLINE",
        headline:      "Portfolio Admin",
        subline:       "Sign in to manage your portfolio dashboard.",
        emailLabel:    "Email Address",
        pwLabel:       "Password",
        forgotPw:      "Forgot password?",
        submitLogin:   "Sign In",
        backToLogin:   "Back to Login",
        resetHeadline: "Reset Password",
        resetSubline:  "Enter your registered email to receive a recovery link.",
        resetSubmit:   "Send Recovery Link",
        resetSuccess:  "A password reset link has been dispatched!",
        loginSuccess:  "Authenticated! Redirecting …",
        errInvalid:    "Invalid email address or password.",
        errNetwork:    "Connection error. Please try again.",
        footerCopy:    "© 2026 Dominik Flüchter"
      }
    };

    let currentLang = localStorage.getItem("lang") || "de";
    let currentTheme = localStorage.getItem("theme") || "dark";
    let currentMode = "login"; // 'login' | 'reset'

    /* ── Theme Handling ── */
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-bs-theme", theme);
      const icon = document.getElementById("theme-icon");
      if (theme === "dark") {
        icon.className = "fa-solid fa-sun";
      } else {
        icon.className = "fa-solid fa-moon";
      }
    }

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      localStorage.setItem("theme", currentTheme);
      applyTheme(currentTheme);
    }

    /* ── Language Handling ── */
    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("lang", lang);

      document.getElementById("lang-de").classList.toggle("active", lang === "de");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");

      updateTextElements();
    }

    function updateTextElements() {
      const t = i18n[currentLang];
      document.title = t.pageTitle;
      document.getElementById("t-system-status").textContent = t.systemStatus;
      document.getElementById("t-email-label").textContent = t.emailLabel;
      document.getElementById("t-pw-label").textContent = t.pwLabel;
      document.getElementById("t-forgot-link").innerHTML = `<i class="fa-solid fa-key me-1"></i>${t.forgotPw}`;
      document.getElementById("t-back-to-login").innerHTML = `<i class="fa-solid fa-arrow-left me-1"></i>${t.backToLogin}`;
      document.getElementById("t-footer-copy").textContent = t.footerCopy;

      if (currentMode === "login") {
        document.getElementById("t-headline").textContent = t.headline;
        document.getElementById("t-subline").textContent = t.subline;
        document.getElementById("t-submit-text").textContent = t.submitLogin;
      } else {
        document.getElementById("t-headline").textContent = t.resetHeadline;
        document.getElementById("t-subline").textContent = t.resetSubline;
        document.getElementById("t-submit-text").textContent = t.resetSubmit;
      }
    }

    /* ── Mode Switcher (Login <-> Reset) ── */
    function switchMode(mode, event) {
      if (event) event.preventDefault();
      currentMode = mode;
      
      const pwGroup = document.getElementById("password-group");
      const backToLoginRow = document.getElementById("back-to-login-row");
      const submitIcon = document.getElementById("submit-btn-icon");

      hideAlerts();

      if (mode === "reset") {
        pwGroup.classList.add("d-none");
        backToLoginRow.classList.remove("d-none");
        submitIcon.className = "fa-solid fa-paper-plane";
      } else {
        pwGroup.classList.remove("d-none");
        backToLoginRow.classList.add("d-none");
        submitIcon.className = "fa-solid fa-arrow-right-to-bracket";
      }

      updateTextElements();
    }

    /* ── Password Visibility Toggle ── */
    function togglePasswordVisibility() {
      const pwInput = document.getElementById("password");
      const eyeIcon = document.getElementById("pw-eye-icon");

      if (pwInput.type === "password") {
        pwInput.type = "text";
        eyeIcon.className = "fa-regular fa-eye-slash";
      } else {
        pwInput.type = "password";
        eyeIcon.className = "fa-regular fa-eye";
      }
    }

    /* ── Alerts & Notifications ── */
    function hideAlerts() {
      document.getElementById("error-banner").classList.add("d-none");
      document.getElementById("success-banner").classList.add("d-none");
    }

    function showError(message) {
      const banner = document.getElementById("error-banner");
      document.getElementById("error-banner-text").textContent = message;
      banner.classList.remove("d-none");
    }

    function showSuccess(message) {
      const banner = document.getElementById("success-banner");
      document.getElementById("success-banner-text").textContent = message;
      banner.classList.remove("d-none");
    }

    /* ── Submit Handler ── */
    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideAlerts();

      const t = i18n[currentLang];
      const btn = document.getElementById("submit-btn");
      const icon = document.getElementById("submit-btn-icon");
      const spinner = document.getElementById("submit-spinner");
      const email = document.getElementById("email").value.trim();

      if (!email) return;

      btn.disabled = true;
      icon.classList.add("d-none");
      spinner.classList.remove("d-none");

      if (currentMode === "login") {
        const password = document.getElementById("password").value;
        if (!password) {
          showError(t.errInvalid);
          btn.disabled = false;
          icon.classList.remove("d-none");
          spinner.classList.add("d-none");
          return;
        }

        try {
          const response = await fetch("/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          if (response.ok) {
            showSuccess(t.loginSuccess);
            setTimeout(() => {
              window.location.href = "/dashboard/";
            }, 750);
          } else {
            let errorMsg = t.errInvalid;
            try {
              const data = await response.json();
              if (data.detail) errorMsg = data.detail;
            } catch (_) {}
            showError(errorMsg);
            btn.disabled = false;
            icon.classList.remove("d-none");
            spinner.classList.add("d-none");
          }
        } catch (err) {
          showError(t.errNetwork);
          btn.disabled = false;
          icon.classList.remove("d-none");
          spinner.classList.add("d-none");
        }
      } else {
        // Password Reset Request
        try {
          const response = await fetch("/api/auth/users/reset_password/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });

          if (response.ok) {
            showSuccess(t.resetSuccess);
            document.getElementById("email").value = "";
            setTimeout(() => {
              switchMode("login");
            }, 3500);
          } else {
            let errorMsg = t.errNetwork;
            try {
              const data = await response.json();
              if (data.detail) errorMsg = data.detail;
            } catch (_) {}
            showError(errorMsg);
          }
        } catch (err) {
          showError(t.errNetwork);
        } finally {
          btn.disabled = false;
          icon.classList.remove("d-none");
          spinner.classList.add("d-none");
        }
      }
    }

    /* ── Initializer ── */
    applyTheme(currentTheme);
    setLanguage(currentLang);
  </script>
</body>
</html>
